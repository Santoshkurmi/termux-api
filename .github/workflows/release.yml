name: Build & Publish Signed Termux:API Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Weekly check on Sundays

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync with Upstream (Scheduled or on request)
        if: github.event_name == 'schedule'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/termux/termux-api.git || true
          git fetch upstream master
          # Attempt fast-forward or merge upstream changes
          if git merge upstream/master --no-edit; then
            git push origin master || echo "No changes to push or push not allowed"
          else
            echo "Merge conflict with upstream; skipping auto-sync merge"
            git merge --abort || true
          fi

      - name: Restore Keystore from Secret
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Error: RELEASE_KEYSTORE_BASE64 secret is missing in GitHub repository settings."
            exit 1
          fi
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.jks

      - name: Extract Version Info
        id: version
        run: |
          CURRENT_VERSION_NAME_REGEX='\s+versionName "([^"]+)"$'
          CURRENT_VERSION_NAME="$(grep -m 1 -E "$CURRENT_VERSION_NAME_REGEX" ./app/build.gradle | sed -r "s/$CURRENT_VERSION_NAME_REGEX/\1/")"
          TAG_NAME="v${CURRENT_VERSION_NAME}-${GITHUB_SHA:0:7}"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version_name=$CURRENT_VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Organize Release Artifacts
        run: |
          mkdir -p release_output
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} release_output/Termux-API-signed.apk \;
          (cd release_output && sha256sum Termux-API-signed.apk > checksums-sha256.txt)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Termux-API-signed
          path: release_output/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Termux:API ${{ steps.version.outputs.tag }} (Signed)
          body: |
            Custom-signed Termux:API companion APK for AntiGem.
            
            - Built from upstream commit: ${{ github.sha }}
            - Signed with AntiGem release certificate for full API integration.
            - SHA256 checksum:
            ```
            ${{ hashFiles('release_output/Termux-API-signed.apk') }}
            ```
          draft: false
          prerelease: false
          files: release_output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


apply plugin: 'com.android.application'

android {
    namespace "com.termux.api"

    compileSdk project.properties.compileSdkVersion.toInteger()
    def appVersionName = System.getenv("TERMUX_API_APP__BUILD__APP_VERSION_NAME") ?: ""
    def apkVersionTag = System.getenv("TERMUX_API_APP__BUILD__APK_VERSION_TAG") ?: ""

    defaultConfig {
        applicationId "ai.antigem.api"
        minSdk project.properties.minSdkVersion.toInteger()
        targetSdk project.properties.targetSdkVersion.toInteger()
        versionCode 1002
        versionName "0.53.0"

        if (appVersionName) versionName = appVersionName
        validateVersionName(versionName)

        manifestPlaceholders.TERMUX_PACKAGE_NAME = "ai.antigem"
        manifestPlaceholders.TERMUX_APP_NAME = "Termux"
        manifestPlaceholders.TERMUX_API_APP_NAME = "Termux:API"
    }

    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword '123456'
            keyAlias 'antigem'
            keyPassword '123456'
        }
        debug {
            storeFile file('testkey_untrusted.jks')
            keyAlias 'alias'
            storePassword 'xrj45yWGLbsO7W0v'
            keyPassword 'xrj45yWGLbsO7W0v'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false // Reproducible builds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }

        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = new File("termux-api-app_" +
                    (apkVersionTag ? apkVersionTag : "v" + versionName + "+" + variant.buildType.name) + ".apk")
        }
    }

    packagingOptions {
        // Remove terminal-emulator and termux-shared JNI libs added via termux-shared dependency
        exclude "lib/*/libtermux.so"
        exclude "lib/*/liblocal-socket.so"
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.1.5"

    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.biometric:biometric:1.2.0-alpha05"
    implementation "androidx.media:media:1.7.0"
    implementation "androidx.preference:preference:1.2.1"

    implementation "com.termux.termux-app:termux-shared:8aca6dbbf4"
    // Use if below libraries are published locally by termux-app with `./gradlew publishReleasePublicationToMavenLocal` and used with `mavenLocal()`.
    // If updates are done, republish there and sync project with gradle files here
    // https://github.com/termux/termux-app/wiki/Termux-Libraries
    //implementation "com.termux:termux-shared:0.118.0"

    implementation "com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava"
}

task versionName {
    doLast {
        print android.defaultConfig.versionName
    }
}

@SuppressWarnings("UnnecessaryQualifiedReference")
static def validateVersionName(String versionName) {
    // https://semver.org/spec/v2.0.0.html#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
    // ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
    if (!java.util.regex.Pattern.matches("^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?\$", versionName))
        throw new GradleException("The versionName '" + versionName + "' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html.")
}

// ---------------------------------------------------------------------------------------------------------------------
// AntiGem: this app is ai.antigem.api, for AntiGem (ai.antigem) instead of Termux. Its code and termux-shared's take the
// Termux app's package from TermuxConstants, which termux-shared compiled as "com.termux" (and javac inlined into this
// app's classes). So while the app is built, every "com.termux" in their string constants becomes "ai.antigem", like
// AntiGem rewrites Termux packages on the phone: the app's package and paths (/data/data/ai.antigem/...), permissions,
// this app's package (ai.antigem.api) and its socket (ai.antigem.api://listen, as the termux-api binary sends).
// Names of Java classes that keep their packages stay: com.termux.api.*, com.termux.shared.*, com.termux.terminal.*,
// com.termux.view.*.
class AntiGemStrings {
    static final String OLD = 'com.termux'
    static final String NEW = 'ai.antigem'
    static final List<String> KEPT = ['.api.', '.shared.', '.terminal.', '.view.']

    static Object rename(Object value) {
        if (!(value instanceof String) || !((String) value).contains(OLD)) return value
        String s = (String) value
        StringBuilder out = new StringBuilder()
        int i = 0
        while (true) {
            int j = s.indexOf(OLD, i)
            if (j < 0) {
                out.append(s.substring(i))
                break
            }
            out.append(s, i, j)
            String rest = s.substring(j + OLD.length())
            out.append(KEPT.any { rest.startsWith(it) } ? OLD : NEW)
            i = j + OLD.length()
        }
        return out.toString()
    }
}

class AntiGemStringsMethodVisitor extends org.objectweb.asm.MethodVisitor {
    AntiGemStringsMethodVisitor(org.objectweb.asm.MethodVisitor next) { super(org.objectweb.asm.Opcodes.ASM9, next) }

    @Override
    void visitLdcInsn(Object value) { super.visitLdcInsn(AntiGemStrings.rename(value)) }

    // string concatenation (StringConcatFactory): its recipe holds the constant parts
    @Override
    void visitInvokeDynamicInsn(String name, String descriptor, org.objectweb.asm.Handle bsm, Object... args) {
        super.visitInvokeDynamicInsn(name, descriptor, bsm, args.collect { AntiGemStrings.rename(it) } as Object[])
    }
}

class AntiGemStringsClassVisitor extends org.objectweb.asm.ClassVisitor {
    AntiGemStringsClassVisitor(org.objectweb.asm.ClassVisitor next) { super(org.objectweb.asm.Opcodes.ASM9, next) }

    // constant fields (static final String X = "...")
    @Override
    org.objectweb.asm.FieldVisitor visitField(int access, String name, String descriptor, String signature, Object value) {
        return super.visitField(access, name, descriptor, signature, AntiGemStrings.rename(value))
    }

    @Override
    org.objectweb.asm.MethodVisitor visitMethod(int access, String name, String descriptor, String signature, String[] exceptions) {
        return new AntiGemStringsMethodVisitor(super.visitMethod(access, name, descriptor, signature, exceptions))
    }
}

abstract class AntiGemPackageStrings implements com.android.build.api.instrumentation.AsmClassVisitorFactory<com.android.build.api.instrumentation.InstrumentationParameters.None> {
    @Override
    org.objectweb.asm.ClassVisitor createClassVisitor(com.android.build.api.instrumentation.ClassContext classContext, org.objectweb.asm.ClassVisitor next) {
        return new AntiGemStringsClassVisitor(next)
    }

    // this app and termux-shared (and its terminal libraries) only
    @Override
    boolean isInstrumentable(com.android.build.api.instrumentation.ClassData classData) {
        return classData.className.startsWith('com.termux.') || classData.className.startsWith('ai.antigem.')
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.instrumentation.transformClassesWith(AntiGemPackageStrings.class,
                com.android.build.api.instrumentation.InstrumentationScope.ALL) {}
        variant.instrumentation.setAsmFramesComputationMode(com.android.build.api.instrumentation.FramesComputationMode.COPY_FRAMES)
    }
}
